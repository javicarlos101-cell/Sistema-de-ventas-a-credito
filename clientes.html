<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clientes | CrediFlow</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#edf2f7;
    color:#1f2937;
}

.wrapper{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:260px;
    background:#17375e;
    color:#fff;
    padding:25px 0;
    flex-shrink:0;
    position:relative;
}

.logo{
    text-align:center;
    margin-bottom:35px;
}

.logo h1{
    font-size:30px;
}

.logo p{
    font-size:14px;
    opacity:.8;
    margin-top:5px;
}

.menu{
    display:flex;
    flex-direction:column;
}

.menu a{
    color:#fff;
    text-decoration:none;
    padding:15px 25px;
    transition:.3s;
    display:flex;
    align-items:center;
    gap:10px;
}

.menu a:hover{
    background:#285b9a;
}

.menu .activo{
    background:#285b9a;
}

/* ======================================================
CONFIGURACION
====================================================== */

.menuConfiguracion{
    position:absolute;
    left:0;
    top:500px;
    width:100%;
}

.menuConfiguracion a{
    color:#fff;
    text-decoration:none;
    padding:15px 25px;
    transition:.3s;
    display:flex;
    align-items:center;
    gap:10px;
}

.menuConfiguracion a:hover{
    background:#285b9a;
}

.main{
    flex:1;
    padding:35px;
    min-width:0;
}

.topo{
    margin-bottom:25px;
}

.topo h2{
    color:#17375e;
    font-size:32px;
}

/* ======================================================
PESTAÑAS
====================================================== */

.pestanas{
    display:flex;
    gap:8px;
    margin-bottom:0;
}

.pestana{
    background:#dbe4ef;
    color:#17375e;
    border:none;
    padding:13px 22px;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    transition:.2s;
}

.pestana:hover{
    background:#cbd8e8;
}

.pestana.activa{
    background:#fff;
    color:#17375e;
}

.contenidoPestana{
    display:none;
}

.contenidoPestana.activo{
    display:block;
}

.card{
    background:#fff;
    padding:25px;
    border-radius:0 12px 12px 12px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.card h3{
    color:#17375e;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:18px;
}

.campo{
    display:flex;
    flex-direction:column;
}

.campo label{
    font-weight:bold;
    margin-bottom:8px;
}

.campo input,
.campo select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
    background:#fff;
}

.campo input:focus,
.campo select:focus{
    outline:none;
    border-color:#285b9a;
    box-shadow:0 0 0 2px rgba(40,91,154,.12);
}

/* ======================================================
TELEFONO
====================================================== */

.telefonoControl{
    display:grid;
    grid-template-columns:95px minmax(0,1fr);
    gap:8px;
}

.telefonoControl select,
.telefonoControl input{
    width:100%;
}

.botones{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:20px;
}

.btnGuardar{
    background:#16a34a;
    color:#fff;
    border:none;
    padding:14px 24px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btnGuardar:hover{
    background:#15803d;
}

.btnLimpiar{
    background:#6b7280;
    color:#fff;
    border:none;
    padding:14px 24px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btnLimpiar:hover{
    background:#4b5563;
}

.btnEditar{
    background:#2563eb;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    margin-right:5px;
}

.btnEliminar{
    background:#f59e0b;
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.btnEditar:hover{
    background:#1d4ed8;
}

.btnEliminar:hover{
    background:#d97706;
}

.btnBuscarClientes{
    background:#2563eb;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btnBuscarClientes:hover{
    background:#1d4ed8;
}

.btnMostrarTodosClientes{
    background:#17375e;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:background .3s;
}

.btnMostrarTodosClientes:hover{
    background:#285b9a;
}

.btnLimpiarBusquedaClientes{
    background:#6b7280;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btnLimpiarBusquedaClientes:hover{
    background:#4b5563;
}

.btnEliminarSeleccionados{
    background:#f59e0b;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btnEliminarSeleccionados:hover{
    background:#d97706;
}

.checkboxCliente{
    width:18px;
    height:18px;
    cursor:pointer;
}

.mensaje{
    display:none;
    margin-bottom:20px;
    padding:14px;
    border-radius:8px;
    font-weight:bold;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
    border:1px solid #86efac;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fca5a5;
}

.tabla-scroll{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:750px;
}

th{
    background:#17375e;
    color:#fff;
    padding:12px;
    white-space:nowrap;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:center;
    white-space:nowrap;
}

tbody tr:hover{
    background:#f8fafc;
}

.autocomplete{
    position:relative;
}

.listaSugerencias{
    position:absolute;
    top:100%;
    left:0;
    right:0;
    background:#fff;
    border:1px solid #d1d5db;
    border-radius:0 0 8px 8px;
    box-shadow:0 6px 15px rgba(0,0,0,.10);
    z-index:1000;
    max-height:280px;
    overflow-y:auto;
    display:none;
}

.sugerenciaCliente{
    padding:11px 12px;
    cursor:pointer;
    border-bottom:1px solid #eef2f7;
}

.sugerenciaCliente:hover{
    background:#f8fafc;
}

.sugerenciaCliente strong{
    display:block;
    color:#17375e;
}

.sugerenciaCliente small{
    display:block;
    color:#6b7280;
    margin-top:3px;
}

/* ======================================================
BUSCADOR CLIENTES REGISTRADOS
====================================================== */

.buscadorClientes{
    display:grid;
    grid-template-columns:minmax(260px,1fr) 140px 155px 140px 140px;
    gap:12px;
    align-items:end;
}

.buscadorClientes .campo{
    min-width:0;
}

.buscadorClientes button{
    width:100%;
    height:44px;
    padding:0 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

#contenedorTablaClientes{
    display:none;
    margin-top:25px;
}

.btnMenuMovil{
    display:none;
}

@media(max-width:1100px){

    .buscadorClientes{
        grid-template-columns:minmax(240px,1fr) 130px 145px;
    }

}


/* ======================================================
VISTA CELULAR
====================================================== */

@media(max-width:800px){

    .wrapper{
        flex-direction:column;
        min-height:100vh;
    }

    .sidebar{
        width:100%;
        padding:20px 16px 30px;
        position:relative;
        min-height:122px;
    }

    .logo{
        margin-bottom:0;
        text-align:left;
        padding-right:65px;
    }

    .logo h1{
        font-size:27px;
        line-height:1.15;
    }

    .logo p{
        font-size:13px;
        margin-top:6px;
    }

    .btnMenuMovil{
        display:flex;
        position:absolute;
        top:20px;
        right:16px;
        width:48px;
        height:48px;
        align-items:center;
        justify-content:center;
        border:none;
        border-radius:10px;
        background:#285b9a;
        color:#fff;
        font-size:23px;
        cursor:pointer;
    }

    .btnMenuMovil:active{
        background:#1d4d85;
    }

    .menu{
        display:none;
        margin-top:18px;
        width:100%;
    }

    .menuConfiguracion{
        display:none;
        position:static;
        width:100%;
        margin-top:6px;
    }

    .sidebar.menuMovilAbierto{
        min-height:auto;
        padding-bottom:20px;
    }

    .sidebar.menuMovilAbierto .menu{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:6px;
    }

    .sidebar.menuMovilAbierto .menuConfiguracion{
        display:block;
    }

    .menu a{
        min-height:44px;
        padding:10px 8px;
        justify-content:flex-start;
        border-radius:7px;
        font-size:14px;
        gap:8px;
    }

    .menu a i{
        width:20px;
        text-align:center;
        font-size:15px;
    }

    .menuConfiguracion a{
        width:100%;
        min-height:44px;
        padding:10px 8px;
        justify-content:flex-start;
        border-radius:7px;
        font-size:14px;
        gap:8px;
    }

    .menuConfiguracion a i{
        width:20px;
        text-align:center;
    }

    .main{
        width:100%;
        padding:16px 14px 24px;
    }

    .topo{
        margin-bottom:14px;
    }

    .topo h2{
        font-size:23px;
        line-height:1.2;
    }


    /* ==================================================
    CLIENTES REGISTRADOS
    BUSCADOR + BOTONES 2 X 2
    ================================================== */

    .buscadorClientes{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
        align-items:stretch;
    }

    .buscadorClientes .campo{
        grid-column:1 / -1;
        width:100%;
        margin-bottom:2px;
    }

    .buscadorClientes button{
        width:100%;
        height:42px;
        min-width:0;
        padding:0 7px;
        font-size:12px;
        border-radius:8px;
        white-space:nowrap;
    }


    /* ==================================================
    CLIENTES REGISTRADOS
    TABLA VERTICAL EN CELULAR
    ================================================== */

    #contenedorTablaClientes{
        margin-top:20px;
    }

    #contenedorTablaClientes .tabla-scroll{
        overflow:visible;
        width:100%;
    }

    #contenedorTablaClientes table{
        display:block;
        width:100%;
        min-width:0;
        border-collapse:separate;
    }

    #contenedorTablaClientes thead{
        display:block;
        width:100%;
        margin-bottom:10px;
    }

    #contenedorTablaClientes thead tr{
        display:block;
        width:100%;
    }

    #contenedorTablaClientes thead th{
        display:none;
    }

    #contenedorTablaClientes thead th:first-child{
        display:flex;
        align-items:center;
        gap:9px;
        width:100%;
        background:#17375e;
        border-radius:8px;
        padding:11px 13px;
        text-align:left;
    }

    #contenedorTablaClientes thead th:first-child::after{
        content:"Seleccionar todos";
        color:#fff;
        font-size:13px;
        font-weight:bold;
    }

    #contenedorTablaClientes tbody{
        display:block;
        width:100%;
    }

    #contenedorTablaClientes tbody tr{
        display:block;
        width:100%;
        background:#f8fafc;
        border-left:5px solid #1d4ed8;
        border-radius:11px;
        margin-bottom:14px;
        padding:10px 12px;
        box-shadow:0 3px 10px rgba(0,0,0,.05);
    }

    #contenedorTablaClientes tbody tr:hover{
        background:#f8fafc;
    }

    #contenedorTablaClientes tbody td{
        display:grid;
        grid-template-columns:105px minmax(0,1fr);
        gap:10px;
        align-items:start;
        width:100%;
        padding:8px 3px;
        border-bottom:1px solid #e5e7eb;
        text-align:left;
        white-space:normal;
        overflow-wrap:anywhere;
        line-height:1.35;
        font-size:13px;
    }

    #contenedorTablaClientes tbody td:first-child{
        display:flex;
        align-items:center;
        padding:5px 3px 10px;
    }

    #contenedorTablaClientes tbody td:first-child::before{
        content:"Seleccionar";
        color:#17375e;
        font-weight:bold;
        width:105px;
        flex-shrink:0;
    }

    #contenedorTablaClientes tbody td:nth-child(2)::before{
        content:"Nombre";
    }

    #contenedorTablaClientes tbody td:nth-child(3)::before{
        content:"Documento";
    }

    #contenedorTablaClientes tbody td:nth-child(4)::before{
        content:"Teléfono";
    }

    #contenedorTablaClientes tbody td:nth-child(5)::before{
        content:"Dirección";
    }

    #contenedorTablaClientes tbody td:nth-child(6)::before{
        content:"Ciudad";
    }

    #contenedorTablaClientes tbody td:nth-child(7)::before{
        content:"Estado";
    }

    #contenedorTablaClientes tbody td:nth-child(8)::before{
        content:"Acciones";
    }

    #contenedorTablaClientes tbody td:nth-child(n+2)::before{
        color:#17375e;
        font-weight:bold;
        text-align:left;
    }

#contenedorTablaClientes tbody td:last-child{
    display:flex;
    align-items:center;
    gap:7px;
    width:100%;
    padding:8px 3px 4px;
    border-bottom:none;
}

#contenedorTablaClientes tbody td:last-child::before{
    content:"Acciones";
    flex:0 0 82px;
    align-self:center;
}

#contenedorTablaClientes tbody td:last-child .btnEditar,
#contenedorTablaClientes tbody td:last-child .btnEliminar{
    width:auto;
    min-width:0;
    height:34px;
    margin:0;
    padding:4px 9px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    white-space:nowrap;
    font-size:11px;
}

#contenedorTablaClientes tbody td:last-child .btnEditar{
    flex:0.9 1 0;
}

#contenedorTablaClientes tbody td:last-child .btnEliminar{
    flex:1.1 1 0;
}

#contenedorTablaClientes tbody td:last-child .btnEditar i,
#contenedorTablaClientes tbody td:last-child .btnEliminar i{
    font-size:11px;
}

    #contenedorTablaClientes .sinRegistros{
        display:block;
        padding:15px;
        text-align:center;
    }

}


/* ======================================================
VISTA CELULAR PEQUEÑA
====================================================== */

@media(max-width:600px){

    .pestanas{
        flex-wrap:wrap;
    }

    .pestana{
        flex:1;
        min-width:150px;
    }

    .telefonoControl{
        grid-template-columns:90px minmax(0,1fr);
    }

}


@media(max-width:420px){

    .sidebar{
        padding:19px 13px 29px;
        min-height:120px;
    }

    .logo h1{
        font-size:25px;
    }

    .logo p{
        font-size:12px;
    }

    .btnMenuMovil{
        top:18px;
        right:13px;
        width:46px;
        height:46px;
        font-size:21px;
    }

    .sidebar.menuMovilAbierto .menu{
        grid-template-columns:1fr;
    }

    .main{
        padding:14px 10px 22px;
    }

    .topo h2{
        font-size:21px;
    }

    .buscadorClientes{
        gap:9px;
    }

    .buscadorClientes button{
        height:40px;
        font-size:11px;
        padding:0 5px;
    }

    #contenedorTablaClientes tbody td{
        grid-template-columns:92px minmax(0,1fr);
        gap:8px;
        font-size:12px;
    }

    #contenedorTablaClientes tbody td:first-child::before{
        width:92px;
    }

}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js?v=2"></script>

</head>

Guardar Cliente

<button
type="button"
class="btnLimpiar"
id="btnLimpiarCliente">

<i class="fa-solid fa-eraser"></i>

Limpiar

</div>

</div>

<script>

let clientes =
JSON.parse(
localStorage.getItem("clientes")
) || [];

let clienteEditando = null;


/* ======================================================
CARGAR CLIENTES DESDE SUPABASE
====================================================== */

async function sincronizarClientesDesdeSupabase(){

    const clientesSupabase =
    await cargarClientesSupabaseCrediFlow();


    if(
        Array.isArray(
            clientesSupabase
        )
    ){

        clientes =
        clientesSupabase;


        localStorage.setItem(
            "clientes",
            JSON.stringify(
                clientes
            )
        );


        actualizarTablaClientes();


        console.log(
            "CLIENTES CARGADOS DESDE SUPABASE:",
            clientes
        );

    }

}


/* ======================================================
REFERENCIAS
====================================================== */

const nombre =
document.getElementById("nombre");

const documento =
document.getElementById("documento");

const telefonoPrefijo =
document.getElementById("telefonoPrefijo");

const telefonoNumero =
document.getElementById("telefonoNumero");

const direccion =
document.getElementById("direccion");

const ciudad =
document.getElementById("ciudad");

const estado =
document.getElementById("estado");

const tablaClientes =
document.getElementById("tablaClientes");

const btnGuardarCliente =
document.getElementById("btnGuardarCliente");

const btnLimpiarCliente =
document.getElementById("btnLimpiarCliente");

const btnEliminarSeleccionados =
document.getElementById("btnEliminarSeleccionados");

const seleccionarTodosClientes =
document.getElementById("seleccionarTodosClientes");

const tituloFormulario =
document.getElementById("tituloFormulario");

const mensaje =
document.getElementById("mensaje");

const pestanaNuevoCliente =
document.getElementById("pestanaNuevoCliente");

const pestanaClientesRegistrados =
document.getElementById("pestanaClientesRegistrados");

const contenidoNuevoCliente =
document.getElementById("contenidoNuevoCliente");

const contenidoClientesRegistrados =
document.getElementById("contenidoClientesRegistrados");

const buscarClientesRegistrados =
document.getElementById("buscarClientesRegistrados");

const sugerenciasClientesRegistrados =
document.getElementById("sugerenciasClientesRegistrados");

const btnBuscarClientes =
document.getElementById("btnBuscarClientes");

const btnMostrarTodosClientes =
document.getElementById("btnMostrarTodosClientes");

const btnLimpiarBusquedaClientes =
document.getElementById("btnLimpiarBusquedaClientes");

const contenedorTablaClientes =
document.getElementById("contenedorTablaClientes");


/* ======================================================
UTILIDADES
====================================================== */

function normalizar(valor){

    return String(
        valor || ""
    )
    .toLowerCase()
    .trim();

}


function separarTelefono(telefonoCompleto){

    const limpio =
    String(
        telefonoCompleto || ""
    )
    .replace(
        /\D/g,
        ""
    );

    const prefijosPermitidos = [
        "0414",
        "0424",
        "0416",
        "0426",
        "0412"
    ];

    const prefijo =
    prefijosPermitidos.find(
        function(item){

            return limpio.startsWith(
                item
            );

        }
    ) || "";

    const numero =
    prefijo
    ? limpio.substring(
        4,
        11
    )
    : "";

    return {
        prefijo:prefijo,
        numero:numero
    };

}


/* ======================================================
VALIDACION DEL NUMERO DE TELEFONO
====================================================== */

telefonoNumero.addEventListener(
    "input",
    function(){

        this.value =
        this.value
        .replace(
            /\D/g,
            ""
        )
        .slice(
            0,
            7
        );

    }
);


/* ======================================================
VALIDAR DOCUMENTO DUPLICADO AL SALIR DEL CAMPO
====================================================== */

documento.addEventListener(
    "blur",
    function(){

        const documentoValor =
        documento.value
        .trim()
        .toLowerCase();

        if(
            documentoValor ===
            ""
        ){
            return;
        }

        clientes =
        JSON.parse(
            localStorage.getItem(
                "clientes"
            )
        ) || [];

        const existe =
        clientes.some(
            function(cliente,index){

                if(
                    clienteEditando !==
                    null &&
                    index ===
                    clienteEditando
                ){

                    return false;

                }

                return String(
                    cliente.documento ||
                    ""
                )
                .trim()
                .toLowerCase() ===
                documentoValor;

            }
        );

        if(
            existe
        ){

            alert(
                "La cédula o documento ya se encuentra registrado. No se puede registrar nuevamente este cliente."
            );

            documento.value =
            "";

        }

    }
);


/* ======================================================
CAMBIO DE PESTAÑAS
====================================================== */

function mostrarPestana(nombrePestana){

    if(
        nombrePestana ===
        "nuevo"
    ){

        pestanaNuevoCliente.classList.add(
            "activa"
        );

        pestanaClientesRegistrados.classList.remove(
            "activa"
        );

        contenidoNuevoCliente.classList.add(
            "activo"
        );

        contenidoClientesRegistrados.classList.remove(
            "activo"
        );

    }else{

        pestanaNuevoCliente.classList.remove(
            "activa"
        );

        pestanaClientesRegistrados.classList.add(
            "activa"
        );

        contenidoNuevoCliente.classList.remove(
            "activo"
        );

        contenidoClientesRegistrados.classList.add(
            "activo"
        );

        buscarClientesRegistrados.value =
        "";

        seleccionarTodosClientes.checked =
        false;

        tablaClientes.innerHTML =
        "";

        contenedorTablaClientes.style.display =
        "none";

    }

}


pestanaNuevoCliente.addEventListener(
    "click",
    function(){

        mostrarPestana(
            "nuevo"
        );

    }
);


pestanaClientesRegistrados.addEventListener(
    "click",
    function(){

        mostrarPestana(
            "registrados"
        );

    }
);


/* ======================================================
MENSAJES
====================================================== */

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    "mensaje " +
    tipo;

    mensaje.style.display =
    "block";


    /* ==================================================
    VISTA CELULAR
    LLEVAR AUTOMATICAMENTE A LA NOTIFICACION
    ================================================== */

    if(
        window.innerWidth <=
        800
    ){

        setTimeout(
            function(){

                mensaje.scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });

            },
            50
        );

    }


    setTimeout(
        function(){

            mensaje.style.display =
            "none";

            mensaje.className =
            "mensaje";

        },
        3000
    );

}


/* ======================================================
SEGURIDAD HTML
====================================================== */

function escaparHTML(valor){

    return String(
        valor || ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ======================================================
MOSTRAR TABLA
====================================================== */

function mostrarTablaClientes(lista){

    if(
        lista.length ===
        0
    ){

        tablaClientes.innerHTML =
        '<tr>' +
        '<td colspan="8" class="sinRegistros">' +
        'No hay clientes para mostrar.' +
        '</td>' +
        '</tr>';

        return;

    }

    const clientesOrdenados =
    lista
    .map(
        function(cliente){

            return {
                cliente:cliente,
                index:clientes.indexOf(
                    cliente
                )
            };

        }
    )
    .sort(
        function(a,b){

            const nombreA =
            String(
                a.cliente.nombre ||
                ""
            )
            .toLowerCase()
            .trim();

            const nombreB =
            String(
                b.cliente.nombre ||
                ""
            )
            .toLowerCase()
            .trim();

            return nombreA.localeCompare(
                nombreB,
                "es",
                {
                    sensitivity:"base"
                }
            );

        }
    );

    let html =
    "";

    clientesOrdenados.forEach(
        function(item){

            const c =
            item.cliente;

            const index =
            item.index;

            html +=

            "<tr>" +

            "<td>" +
            '<input ' +
            'type="checkbox" ' +
            'class="checkboxCliente clienteSeleccionado" ' +
            'data-index="' +
            index +
            '">' +
            "</td>" +

            "<td>" +
            escaparHTML(c.nombre) +
            "</td>" +

            "<td>" +
            escaparHTML(c.documento) +
            "</td>" +

            "<td>" +
            escaparHTML(c.telefono) +
            "</td>" +

            "<td>" +
            escaparHTML(c.direccion) +
            "</td>" +

            "<td>" +
            escaparHTML(c.ciudad) +
            "</td>" +

            "<td>" +
            escaparHTML(
                c.estado || ""
            ) +
            "</td>" +

            "<td>" +

            '<button type="button" class="btnEditar" onclick="editarCliente(' +
            index +
            ')">' +

            '<i class="fa-solid fa-pen"></i> Editar' +

            '</button>' +

            '<button type="button" class="btnEliminar" onclick="eliminarCliente(' +
            index +
            ')">' +

            '<i class="fa-solid fa-trash"></i> Eliminar' +

            '</button>' +

            "</td>" +

            "</tr>";

        }
    );

    tablaClientes.innerHTML =
    html;

}


/* ======================================================
ACTUALIZAR TABLA
====================================================== */

function actualizarTablaClientes(){

    clientes =
    JSON.parse(
        localStorage.getItem(
            "clientes"
        )
    ) || [];

    mostrarTablaClientes(
        clientes
    );

}


/* ======================================================
BUSCAR CLIENTES REGISTRADOS
====================================================== */

function mostrarSugerenciasClientesRegistrados(){

    clientes =
    JSON.parse(
        localStorage.getItem(
            "clientes"
        )
    ) || [];

    const termino =
    normalizar(
        buscarClientesRegistrados.value
    );

    sugerenciasClientesRegistrados.innerHTML =
    "";

    if(
        !termino
    ){

        sugerenciasClientesRegistrados.style.display =
        "none";

        return;

    }

    const coincidencias =
    clientes
    .filter(
        function(cliente){

            return (
                normalizar(
                    cliente.nombre
                )
                .includes(
                    termino
                ) ||
                normalizar(
                    cliente.documento
                )
                .includes(
                    termino
                )
            );

        }
    )
    .slice(
        0,
        10
    );

    if(
        !coincidencias.length
    ){

        sugerenciasClientesRegistrados.style.display =
        "none";

        return;

    }

    coincidencias.forEach(
        function(cliente){

            const div =
            document.createElement(
                "div"
            );

            div.className =
            "sugerenciaCliente";

            div.innerHTML =
            "<strong>" +
            escaparHTML(
                cliente.nombre
            ) +
            "</strong>" +
            "<small>" +
            escaparHTML(
                cliente.documento ||
                ""
            ) +
            "</small>";

            div.addEventListener(
                "click",
                function(){

                    buscarClientesRegistrados.value =
                    cliente.nombre;

                    sugerenciasClientesRegistrados.style.display =
                    "none";

                }
            );

            sugerenciasClientesRegistrados.appendChild(
                div
            );

        }
    );

    sugerenciasClientesRegistrados.style.display =
    "block";

}


buscarClientesRegistrados.addEventListener(
    "input",
    mostrarSugerenciasClientesRegistrados
);


buscarClientesRegistrados.addEventListener(
    "focus",
    mostrarSugerenciasClientesRegistrados
);


document.addEventListener(
    "click",
    function(event){

        if(
            !event.target.closest(
                ".autocomplete"
            )
        ){

            sugerenciasClientesRegistrados.style.display =
            "none";

        }

    }
);


btnBuscarClientes.addEventListener(
    "click",
    function(){

        clientes =
        JSON.parse(
            localStorage.getItem(
                "clientes"
            )
        ) || [];

        const termino =
        normalizar(
            buscarClientesRegistrados.value
        );

        seleccionarTodosClientes.checked =
        false;

        if(
            !termino
        ){

            tablaClientes.innerHTML =
            "";

            contenedorTablaClientes.style.display =
            "none";

            mostrarMensaje(
                "Debe ingresar un nombre o documento para realizar la búsqueda.",
                "error"
            );

            return;

        }

        const lista =
        clientes.filter(
            function(cliente){

                return (
                    normalizar(
                        cliente.nombre
                    )
                    .includes(
                        termino
                    ) ||
                    normalizar(
                        cliente.documento
                    )
                    .includes(
                        termino
                    )
                );

            }
        );

        contenedorTablaClientes.style.display =
        "block";

        mostrarTablaClientes(
            lista
        );

        if(
            window.innerWidth <= 800
        ){

            setTimeout(
                function(){

                    contenedorTablaClientes.scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

                },
                150
            );

        }

    }
);


/* ======================================================
MOSTRAR TODOS
====================================================== */

btnMostrarTodosClientes.addEventListener(
    "click",
    function(){

        clientes =
        JSON.parse(
            localStorage.getItem(
                "clientes"
            )
        ) || [];

        buscarClientesRegistrados.value =
        "";

        seleccionarTodosClientes.checked =
        false;

        contenedorTablaClientes.style.display =
        "block";

        mostrarTablaClientes(
            clientes
        );

        if(
            window.innerWidth <= 800
        ){

            setTimeout(
                function(){

                    contenedorTablaClientes.scrollIntoView({
                        behavior:"smooth",
                        block:"start"
                    });

                },
                150
            );

        }

    }
);


/* ======================================================
LIMPIAR BUSQUEDA
====================================================== */

btnLimpiarBusquedaClientes.addEventListener(
    "click",
    function(){

        buscarClientesRegistrados.value =
        "";

        seleccionarTodosClientes.checked =
        false;

        tablaClientes.innerHTML =
        "";

        contenedorTablaClientes.style.display =
        "none";

    }
);


/* ======================================================
LIMPIAR FORMULARIO
====================================================== */

function limpiarFormulario(){

    clienteEditando =
    null;

    nombre.value =
    "";

    documento.value =
    "";

    telefonoPrefijo.value =
    "";

    telefonoNumero.value =
    "";

    direccion.value =
    "";

    ciudad.value =
    "";

    estado.value =
    "";

    tituloFormulario.textContent =
    "Nuevo Cliente";

    btnGuardarCliente.innerHTML =
    '<i class="fa-solid fa-floppy-disk"></i> ' +
    'Guardar Cliente';

}


/* ======================================================
EDITAR CLIENTE
====================================================== */

function editarCliente(index){

    const cliente =
    clientes[index];

    if(
        !cliente
    ){
        return;
    }

    clienteEditando =
    index;

    nombre.value =
    cliente.nombre ||
    "";

    documento.value =
    cliente.documento ||
    "";

    const datosTelefono =
    separarTelefono(
        cliente.telefono
    );

    telefonoPrefijo.value =
    datosTelefono.prefijo;

    telefonoNumero.value =
    datosTelefono.numero;

    direccion.value =
    cliente.direccion ||
    "";

    ciudad.value =
    cliente.ciudad ||
    "";

    estado.value =
    cliente.estado ||
    "";

    tituloFormulario.textContent =
    "Editar Cliente";

    btnGuardarCliente.innerHTML =
    '<i class="fa-solid fa-rotate"></i> ' +
    'Actualizar Cliente';

    mostrarPestana(
        "nuevo"
    );

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ======================================================
ELIMINAR CLIENTE
====================================================== */

function eliminarCliente(index){

    const cliente =
    clientes[index];

    if(
        !cliente
    ){
        return;
    }

    const confirmar =
    confirm(
        "¿Desea eliminar al cliente " +
        (
            cliente.nombre ||
            ""
        ) +
        "?\n\nEsta acción eliminará el registro del cliente de la lista."
    );

    if(
        !confirmar
    ){
        return;
    }

    clientes.splice(
        index,
        1
    );

    localStorage.setItem(
        "clientes",
        JSON.stringify(
            clientes
        )
    );

    actualizarTablaClientes();

    contenedorTablaClientes.style.display =
    "block";

    if(
        clienteEditando ===
        index
    ){

        limpiarFormulario();

    }

    mostrarMensaje(
        "Cliente eliminado correctamente.",
        "exito"
    );

}


/* ======================================================
ELIMINAR CLIENTES SELECCIONADOS
====================================================== */

if(
    btnEliminarSeleccionados
){

    btnEliminarSeleccionados.addEventListener(
        "click",
        function(){

            const seleccionados =
            Array.from(
                document.querySelectorAll(
                    ".clienteSeleccionado:checked"
                )
            )
            .map(
                function(checkbox){

                    return Number(
                        checkbox.dataset.index
                    );

                }
            );

            if(
                seleccionados.length ===
                0
            ){

                mostrarMensaje(
                    "Seleccione al menos un cliente para eliminar.",
                    "error"
                );

                return;

            }

            const confirmar =
            confirm(
                "¿Está seguro de que desea eliminar " +
                seleccionados.length +
                " cliente(s) seleccionado(s)?"
            );

            if(
                !confirmar
            ){
                return;
            }

            seleccionados
            .sort(
                function(a,b){

                    return b - a;

                }
            )
            .forEach(
                function(index){

                    clientes.splice(
                        index,
                        1
                    );

                }
            );

            localStorage.setItem(
                "clientes",
                JSON.stringify(
                    clientes
                )
            );

            clientes =
            JSON.parse(
                localStorage.getItem(
                    "clientes"
                )
            ) || [];

            seleccionarTodosClientes.checked =
            false;

            actualizarTablaClientes();

            contenedorTablaClientes.style.display =
            "block";

            mostrarMensaje(
                "✓ Clientes seleccionados eliminados correctamente.",
                "exito"
            );

        }
    );

}


/* ======================================================
SELECCIONAR / DESELECCIONAR TODOS
====================================================== */

if(
    seleccionarTodosClientes
){

    seleccionarTodosClientes.addEventListener(
        "change",
        function(){

            const checkboxes =
            document.querySelectorAll(
                ".clienteSeleccionado"
            );

            checkboxes.forEach(
                function(checkbox){

                    checkbox.checked =
                    seleccionarTodosClientes.checked;

                }
            );

        }
    );

}


/* ======================================================
GUARDAR / ACTUALIZAR CLIENTE
TODOS LOS CAMPOS SON OBLIGATORIOS
====================================================== */

btnGuardarCliente.addEventListener(
    "click",
    async function(){

        const nombreValor =
        nombre.value.trim();

        const documentoValor =
        documento.value.trim();

        const telefonoPrefijoValor =
        telefonoPrefijo.value.trim();

        const telefonoNumeroValor =
        telefonoNumero.value.trim();

        const direccionValor =
        direccion.value.trim();

        const ciudadValor =
        ciudad.value.trim();

        const estadoValor =
        estado.value.trim();


        if(
            nombreValor ===
            ""
        ){

            mostrarMensaje(
                "Debe ingresar el nombre del cliente.",
                "error"
            );

            nombre.focus();

            return;

        }


        if(
            documentoValor ===
            ""
        ){

            mostrarMensaje(
                "Debe ingresar la cédula o documento del cliente.",
                "error"
            );

            documento.focus();

            return;

        }


        if(
            telefonoPrefijoValor ===
            ""
        ){

            mostrarMensaje(
                "Debe seleccionar el prefijo del teléfono.",
                "error"
            );

            telefonoPrefijo.focus();

            return;

        }


        if(
            telefonoNumeroValor ===
            ""
        ){

            mostrarMensaje(
                "Debe ingresar el número de teléfono.",
                "error"
            );

            telefonoNumero.focus();

            return;

        }


        if(
            !/^\d{7}$/.test(
                telefonoNumeroValor
            )
        ){

            mostrarMensaje(
                "El número de teléfono debe contener exactamente 7 dígitos.",
                "error"
            );

            telefonoNumero.focus();

            return;

        }


        if(
            direccionValor ===
            ""
        ){

            mostrarMensaje(
                "Debe ingresar la dirección del cliente.",
                "error"
            );

            direccion.focus();

            return;

        }


        if(
            ciudadValor ===
            ""
        ){

            mostrarMensaje(
                "Debe ingresar la ciudad del cliente.",
                "error"
            );

            ciudad.focus();

            return;

        }


        if(
            estadoValor ===
            ""
        ){

            mostrarMensaje(
                "Debe seleccionar el estado.",
                "error"
            );

            estado.focus();

            return;

        }


        const telefonoValor =
        telefonoPrefijoValor +
        "-" +
        telefonoNumeroValor;


        if(
            clienteEditando ===
            null
        ){

            clientes =
            JSON.parse(
                localStorage.getItem(
                    "clientes"
                )
            ) || [];

            const documentoExiste =
            clientes.some(
                function(c){

                    return String(
                        c.documento ||
                        ""
                    )
                    .toLowerCase()
                    .trim() ===
                    documentoValor
                    .toLowerCase();

                }
            );

            if(
                documentoExiste
            ){

                alert(
                    "La cédula o documento ya se encuentra registrado. No se puede registrar nuevamente este cliente."
                );

                documento.value =
                "";

                return;

            }


            clientes.push({

                id:
                "CLI-" +
                Date.now(),

                nombre:
                nombreValor,

                documento:
                documentoValor,

                telefono:
                telefonoValor,

                direccion:
                direccionValor,

                ciudad:
                ciudadValor,

                estado:
                estadoValor

            });


            mostrarMensaje(
                "Cliente registrado correctamente.",
                "exito"
            );

        }else{

            clientes =
            JSON.parse(
                localStorage.getItem(
                    "clientes"
                )
            ) || [];

            const documentoExiste =
            clientes.some(
                function(c,index){

                    return (
                        index !==
                        clienteEditando &&
                        String(
                            c.documento ||
                            ""
                        )
                        .toLowerCase()
                        .trim() ===
                        documentoValor
                        .toLowerCase()
                    );

                }
            );

            if(
                documentoExiste
            ){

                alert(
                    "La cédula o documento ya se encuentra registrado para otro cliente."
                );

                documento.value =
                "";

                return;

            }


            clientes[
                clienteEditando
            ] = {

                ...clientes[
                    clienteEditando
                ],

                nombre:
                nombreValor,

                documento:
                documentoValor,

                telefono:
                telefonoValor,

                direccion:
                direccionValor,

                ciudad:
                ciudadValor,

                estado:
                estadoValor

            };


            mostrarMensaje(
                "Cliente actualizado correctamente.",
                "exito"
            );

        }


               localStorage.setItem(
            "clientes",
            JSON.stringify(
                clientes
            )
        );


        const clienteGuardado =
        clienteEditando === null
        ? clientes[
            clientes.length - 1
        ]
        : clientes[
            clienteEditando
        ];


        const resultadoSupabase =
        await guardarClienteSupabaseCrediFlow(
            clienteGuardado
        );


        if(
            !resultadoSupabase.ok
        ){

            alert(
                "No fue posible guardar el cliente en la base de datos central."
            );

            return;

        }


        actualizarTablaClientes();

        limpiarFormulario();

    }
);


/* ======================================================
BOTÓN LIMPIAR
====================================================== */

btnLimpiarCliente.addEventListener(
    "click",
    function(){

        limpiarFormulario();

    }
);

/* ======================================================
PERMISOS DEL COLABORADOR - CLIENTES
====================================================== */

const esColaboradorClientesCrediFlow =
String(
    sessionStorage.getItem(
        "rolCrediFlowSesion"
    ) ||
    ""
)
.trim()
.toLowerCase() ===
"colaborador";


function aplicarPermisosColaboradorClientes(){

    if(
        !esColaboradorClientesCrediFlow
    ){
        return;
    }


    /* ==================================================
    MENU
    ================================================== */

    const enlaceReportesClientes =
    document.querySelector(
        '.menu a[href="reportes.html"]'
    );

    const enlaceConfiguracionClientes =
    document.querySelector(
        '.menuConfiguracion a[href="configuracion.html"]'
    );

    if(
        enlaceReportesClientes
    ){

        enlaceReportesClientes.style.display =
        "none";

    }

    if(
        enlaceConfiguracionClientes
    ){

        enlaceConfiguracionClientes.style.display =
        "none";

    }


    /* ==================================================
    CLIENTES REGISTRADOS
    OCULTAR BOTON ELIMINAR DEL BUSCADOR
    ================================================== */

    if(
        btnEliminarSeleccionados
    ){

        btnEliminarSeleccionados.style.display =
        "none";

    }

    /* ==================================================
    OCULTAR COLUMNA DE SELECCION
    ================================================== */

    const tablaSeleccionClientes =
    document.querySelector(
        "#contenedorTablaClientes table"
    );

    if(
        tablaSeleccionClientes
    ){

        const encabezadoSeleccion =
        tablaSeleccionClientes.querySelector(
            "thead th:first-child"
        );

        if(
            encabezadoSeleccion
        ){

            encabezadoSeleccion.style.display =
            "none";

        }

        tablaSeleccionClientes
        .querySelectorAll(
            "tbody tr"
        )
        .forEach(
            function(fila){

                const primeraCelda =
                fila.querySelector(
                    "td:first-child"
                );

                if(
                    primeraCelda
                ){

                    primeraCelda.style.display =
                    "none";

                }

            }
        );

    }
    /* ==================================================
    CLIENTES REGISTRADOS
    OCULTAR COLUMNA ACCIONES
    ================================================== */

    const tablaClientesRegistrados =
    document.querySelector(
        "#contenedorTablaClientes table"
    );

    if(
        tablaClientesRegistrados
    ){

        const encabezados =
        tablaClientesRegistrados.querySelectorAll(
            "thead th"
        );

        if(
            encabezados.length >= 8
        ){

            encabezados[
                encabezados.length - 1
            ].style.display =
            "none";

        }


        tablaClientesRegistrados
        .querySelectorAll(
            "tbody tr"
        )
        .forEach(
            function(fila){

                const celdas =
                fila.querySelectorAll(
                    "td"
                );

                if(
                    celdas.length >= 8
                ){

                    celdas[
                        celdas.length - 1
                    ].style.display =
                    "none";

                }

            }
        );

    }

}


/* ======================================================
APLICAR PERMISOS AL CARGAR
====================================================== */

aplicarPermisosColaboradorClientes();


/* ======================================================
MANTENER PERMISOS EN TABLAS GENERADAS DINAMICAMENTE
====================================================== */

if(
    esColaboradorClientesCrediFlow
){

    const observadorPermisosClientes =
    new MutationObserver(
        function(){

            aplicarPermisosColaboradorClientes();

        }
    );

    observadorPermisosClientes.observe(
        tablaClientes,
        {
            childList:true,
            subtree:true
        }
    );

}
/* ======================================================
SALIR DEL SISTEMA
====================================================== */

const btnSalirCrediFlow =
document.getElementById(
    "btnSalirCrediFlow"
);

if(
    btnSalirCrediFlow
){

    btnSalirCrediFlow.addEventListener(
        "click",
        function(event){

            event.preventDefault();

            sessionStorage.removeItem(
                "sesionCrediFlow"
            );

            localStorage.removeItem(
                "rolCrediFlow"
            );

            localStorage.removeItem(
                "usuarioCrediFlow"
            );

            window.location.href =
            "index.html";

        }
    );

}


/* ======================================================
MENU MOVIL
EXCLUSIVO PARA VISTA CELULAR
====================================================== */

const btnMenuMovil =
document.getElementById(
    "btnMenuMovil"
);

const sidebarMovil =
document.querySelector(
    ".sidebar"
);

if(
    btnMenuMovil &&
    sidebarMovil
){

    btnMenuMovil.addEventListener(
        "click",
        function(){

            const abierto =
            sidebarMovil.classList.toggle(
                "menuMovilAbierto"
            );

            btnMenuMovil.setAttribute(
                "aria-expanded",
                abierto
                ? "true"
                : "false"
            );

            btnMenuMovil.innerHTML =
            abierto
            ? '<i class="fa-solid fa-xmark"></i>'
            : '<i class="fa-solid fa-bars"></i>';

        }
    );


    document
    .querySelectorAll(
        ".menu a, .menuConfiguracion a"
    )
    .forEach(
        function(enlace){

            enlace.addEventListener(
                "click",
                function(){

                    sidebarMovil.classList.remove(
                        "menuMovilAbierto"
                    );

                    btnMenuMovil.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    btnMenuMovil.innerHTML =
                    '<i class="fa-solid fa-bars"></i>';

                }
            );

        }
    );

}


/* ======================================================
INICIAR
====================================================== */

limpiarFormulario();

buscarClientesRegistrados.value =
"";

tablaClientes.innerHTML =
"";

contenedorTablaClientes.style.display =
"none";

sincronizarClientesDesdeSupabase();

</script>
